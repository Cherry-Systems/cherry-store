name: Publish
on:
  issues:
    types: [opened]
  repository_dispatch:
    types: [cherry-upload, cherry-yank]
  workflow_dispatch:
    inputs:
      action:
        description: takedown or restore
        type: choice
        options: [takedown, restore]
      name:
        description: Package name
        required: true
      reason:
        description: Why (shown to people)
        required: false

# One at a time, so two uploads never fight over index.json.
concurrency:
  group: store-index
  cancel-in-progress: false

permissions:
  contents: write
  issues: write

jobs:
  run:
    if: >-
      github.event_name != 'issues' ||
      startsWith(github.event.issue.title, 'Publish:') ||
      startsWith(github.event.issue.title, 'Withdraw:')
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq clamav python3-cryptography > /dev/null
          sudo systemctl stop clamav-freshclam || true
          # Without signatures the scan comes out as an error and Cherry warns "not virus-scanned yet".
          sudo freshclam --quiet || echo "::warning::couldn't update the virus signatures"
      - uses: actions/cache@v4
        with:
          path: ~/debian-names.txt
          key: debian-names-${{ github.run_id }}
          restore-keys: debian-names-
      - name: Handle the request
        env:
          GH_TOKEN: ${{ github.token }}
          CHERRY_CLOUD_URL: ${{ vars.CHERRY_CLOUD_URL }}
          STORE_TOKEN: ${{ secrets.STORE_TOKEN }}
          DEBIAN_NAMES_CACHE: /home/runner/debian-names.txt
        run: /usr/bin/python3 tools/pipeline.py "$GITHUB_EVENT_PATH"
      - name: Answer the issue if the store broke
        if: failure() && github.event_name == 'issues'
        env:
          GH_TOKEN: ${{ github.token }}
          NUMBER: ${{ github.event.issue.number }}
          RUN: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          gh issue comment "$NUMBER" --body "Not published: the store had a problem ($RUN). Try again later."
          gh issue close "$NUMBER" --reason "not planned"
